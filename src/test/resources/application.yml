spring:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: wtf.milehimikey.coffeeshop.config.ByteaEnforcedPostgresSQLDialect

# Axon Configuration for tests
axon:
  metrics:
    # See src/main/resources/application.yml - avoids the duplicate
    # MetricsConfigurationEnhancer registration that fails context startup.
    enabled: false
  axonserver:
    enabled: false
  # Processor mode is declared in code (AxonConfig.kt) via EventProcessorDefinition beans.
  eventhandling:
    processors:
      payment:
        thread-count: 8
      order:
        thread-count: 8
      product:
        thread-count: 8
      reporting:
        thread-count: 4
