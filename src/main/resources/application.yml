management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    metrics:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: coffee-shop

  # MongoDB Configuration
  data:
    mongodb:
      host: localhost
      port: 27017
      database: coffeeshop
      username: root
      password: secret
      authentication-database: admin

  # PostgreSQL Configuration for Axon Event Store
  datasource:
    url: jdbc:postgresql://localhost:5432/coffeeshop
    username: coffeeshop
    password: secret

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: wtf.milehimikey.coffeeshop.config.ByteaEnforcedPostgresSQLDialect

  # Task scheduling configuration
  task:
    scheduling:
      pool:
        size: 5

# Server Configuration
server:
  port: 8080

# Axon Configuration
axon:
  metrics:
    micrometer:
      dimensional: true
    # Deliberately off. axon-metrics-micrometer registers MetricsConfigurationEnhancer
    # through BOTH META-INF/services (ServiceLoader) and Spring auto-configuration.
    # Leaving both active fails startup with "Duplicate key MetricsConfigurationEnhancer".
    # The ServiceLoader registration still supplies Axon metrics.
    enabled: false
  axonserver:
    enabled: true
    servers: localhost:8124
    context: default
    component-name: coffee-shop
  # Processor mode is declared in code (AxonConfig.kt) via EventProcessorDefinition
  # beans; only the tuning knobs are property-driven.
  eventhandling:
    processors:
      order:
        thread-count: 8
        batch-size: 10
      payment:
        thread-count: 8
        batch-size: 10
      product:
        thread-count: 8
        batch-size: 10
      reporting:
        thread-count: 4
        batch-size: 10
